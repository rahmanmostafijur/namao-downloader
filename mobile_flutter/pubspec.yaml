name: namao_app
description: "Namao (নামাও) - download videos straight to your Android phone."
publish_to: 'none'

# Keep in sync with the user-visible version. The native side reports versionName from this value.
version: 1.1.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.7
  # SHA-256 of a downloaded app update. Already in the build (cached_network_image uses it).
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Notices for the downloader components bundled in the app (see lib/core/licenses.dart).
    - assets/licenses/
  fonts:
    # Variable fonts (Google Fonts, SIL OFL 1.1). Bundled: no runtime network font loading.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
